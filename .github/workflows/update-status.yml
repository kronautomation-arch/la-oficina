name: Auto-commit status updates

on:
  schedule:
    - cron: '*/5 * * * *'  # Cada 5 minutos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for status changes
        run: |
          git add status.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "La Oficina Bot"
          git config user.email "bot@laoficina.dev"
          git commit -m "📊 Status update $(date -u +%H:%M)"
          git push
