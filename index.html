<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏢 La Oficina — Automation Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #222240;
            --accent-blue: #4f8fff;
            --accent-green: #00e88f;
            --accent-yellow: #ffc145;
            --accent-red: #ff4757;
            --accent-purple: #a855f7;
            --accent-cyan: #06d6a0;
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --text-muted: #555570;
            --border: #2a2a40;
            --glow-blue: rgba(79, 143, 255, 0.15);
            --glow-green: rgba(0, 232, 143, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                linear-gradient(rgba(79, 143, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 143, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* Ambient glow orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 15s ease-in-out infinite;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--accent-blue); top: -100px; right: -100px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: var(--accent-purple); bottom: -50px; left: -50px; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: var(--accent-cyan); top: 50%; left: 50%; animation-delay: -10s; }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ─── Header ─── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 32px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .office-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 32px rgba(79, 143, 255, 0.3);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(79, 143, 255, 0.3); }
            50% { box-shadow: 0 8px 48px rgba(79, 143, 255, 0.5); }
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #aab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-title p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 232, 143, 0.1);
            border: 1px solid rgba(0, 232, 143, 0.2);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent-green);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: livePulse 2s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0, 232, 143, 0.4); }
            50% { opacity: 0.6; box-shadow: 0 0 0 8px rgba(0, 232, 143, 0); }
        }

        .last-update {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* ─── Stats Bar ─── */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(79, 143, 255, 0.3);
            transform: translateY(-2px);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 16px 16px 0 0;
        }

        .stat-card:nth-child(1)::after { background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan)); }
        .stat-card:nth-child(2)::after { background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); }
        .stat-card:nth-child(3)::after { background: linear-gradient(90deg, var(--accent-yellow), #ff8c00); }
        .stat-card:nth-child(4)::after { background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue)); }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .stat-card:nth-child(1) .stat-value { color: var(--accent-green); }
        .stat-card:nth-child(2) .stat-value { color: var(--accent-blue); }
        .stat-card:nth-child(3) .stat-value { color: var(--accent-yellow); }
        .stat-card:nth-child(4) .stat-value { color: var(--accent-purple); }

        .stat-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ─── Main Grid ─── */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
        }

        /* ─── Employee Cards ─── */
        .employees-section h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .employee-count {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 2px 10px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .employees-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .employee-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
        }

        .employee-card:hover {
            border-color: rgba(79, 143, 255, 0.3);
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .employee-card.status-working { border-left: 3px solid var(--accent-green); }
        .employee-card.status-idle { border-left: 3px solid var(--accent-yellow); }
        .employee-card.status-sleeping { border-left: 3px solid var(--accent-blue); }
        .employee-card.status-error { border-left: 3px solid var(--accent-red); }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .employee-avatar {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            position: relative;
        }

        .status-working .employee-avatar { background: rgba(0, 232, 143, 0.15); }
        .status-idle .employee-avatar { background: rgba(255, 193, 69, 0.15); }
        .status-sleeping .employee-avatar { background: rgba(79, 143, 255, 0.15); }
        .status-error .employee-avatar { background: rgba(255, 71, 87, 0.15); }

        /* Typing animation for working status */
        .typing-indicator {
            position: absolute;
            bottom: -4px;
            right: -4px;
            display: flex;
            gap: 2px;
            background: var(--bg-card);
            padding: 3px 5px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .typing-dot {
            width: 4px;
            height: 4px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.working { background: rgba(0, 232, 143, 0.12); color: var(--accent-green); }
        .status-badge.idle { background: rgba(255, 193, 69, 0.12); color: var(--accent-yellow); }
        .status-badge.sleeping { background: rgba(79, 143, 255, 0.12); color: var(--accent-blue); }
        .status-badge.error { background: rgba(255, 71, 87, 0.12); color: var(--accent-red); }

        .status-badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .status-badge.working .status-badge-dot { background: var(--accent-green); animation: livePulse 2s ease-in-out infinite; }
        .status-badge.idle .status-badge-dot { background: var(--accent-yellow); }
        .status-badge.sleeping .status-badge-dot { background: var(--accent-blue); }
        .status-badge.error .status-badge-dot { background: var(--accent-red); animation: livePulse 1s ease-in-out infinite; }

        .employee-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .employee-role {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .employee-dept {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 8px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .current-task {
            margin-top: 16px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .current-task-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .current-task-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .employee-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 16px;
        }

        .metric {
            text-align: center;
            padding: 8px 4px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }

        .metric-value {
            font-size: 16px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .metric-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .employee-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .schedule-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .uptime-info {
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
        }

        /* ─── Activity Feed ─── */
        .activity-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            height: fit-content;
            max-height: 700px;
            display: flex;
            flex-direction: column;
        }

        .activity-section h2 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .activity-feed {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .activity-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            transition: background 0.2s;
            animation: slideIn 0.3s ease-out;
        }

        .activity-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .activity-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
        }

        .activity-content {
            flex: 1;
            min-width: 0;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }

        .activity-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .activity-time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }

        .activity-message {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.4;
        }

        .activity-divider {
            height: 1px;
            background: var(--border);
            margin: 4px 12px;
            opacity: 0.5;
        }

        /* ─── Responsive ─── */
        @media (max-width: 1100px) {
            .main-grid { grid-template-columns: 1fr; }
            .employees-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 700px) {
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .employees-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ─── Progress Ring (success rate) ─── */
        .progress-ring {
            transform: rotate(-90deg);
        }
        .progress-ring-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 3;
        }
        .progress-ring-fill {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease;
        }

        /* ─── Shimmer loading ─── */
        .shimmer {
            background: linear-gradient(90deg, var(--bg-card) 0%, var(--bg-card-hover) 50%, var(--bg-card) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ─── Floating particles for working employees ─── */
        .particles-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: 20px;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 4s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(100%) scale(0); }
            20% { opacity: 0.6; }
            80% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(-20px) scale(1); }
        }
    </style>
</head>
<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="office-icon">🏢</div>
                <div class="header-title">
                    <h1>La Oficina</h1>
                    <p>Centro de Automatizaciones</p>
                </div>
            </div>
            <div class="header-right">
                <div class="live-indicator">
                    <span class="live-dot"></span>
                    EN VIVO
                </div>
                <span class="last-update" id="lastUpdate">Actualizando...</span>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-label">Trabajando</div>
                <div class="stat-value" id="statWorking">—</div>
                <div class="stat-sub">empleados activos</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tareas Hoy</div>
                <div class="stat-value" id="statTasks">—</div>
                <div class="stat-sub">completadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tasa de Éxito</div>
                <div class="stat-value" id="statSuccess">—</div>
                <div class="stat-sub">promedio general</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Histórico</div>
                <div class="stat-value" id="statTotal">—</div>
                <div class="stat-sub">tareas completadas</div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Employees -->
            <div class="employees-section">
                <h2>
                    Equipo
                    <span class="employee-count" id="employeeCount">0 empleados</span>
                </h2>
                <div class="employees-grid" id="employeesGrid">
                    <!-- Cards rendered by JS -->
                </div>
            </div>

            <!-- Activity Feed -->
            <div class="activity-section">
                <h2>💬 Chat de la Oficina</h2>
                <div class="activity-feed" id="activityFeed">
                    <!-- Activity items rendered by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ─── Status Config ───
        const STATUS_CONFIG = {
            working:  { label: 'Trabajando', icon: '⚡', color: '#00e88f' },
            idle:     { label: 'En Break',   icon: '☕', color: '#ffc145' },
            sleeping: { label: 'Dormido',    icon: '💤', color: '#4f8fff' },
            error:    { label: 'Error',      icon: '🔥', color: '#ff4757' }
        };

        // ─── Render Employee Card ───
        function renderEmployeeCard(emp) {
            const cfg = STATUS_CONFIG[emp.status] || STATUS_CONFIG.idle;
            const typingHTML = emp.status === 'working' ? `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>` : '';

            const particlesHTML = emp.status === 'working' ? `
                <div class="particles-container">
                    ${Array.from({length: 6}, (_, i) => `
                        <div class="particle" style="
                            left: ${15 + Math.random() * 70}%;
                            bottom: 0;
                            background: ${cfg.color};
                            animation-delay: ${i * 0.7}s;
                            animation-duration: ${3 + Math.random() * 2}s;
                        "></div>`).join('')}
                </div>` : '';

            const lastActive = emp.last_activity ? timeAgo(new Date(emp.last_activity)) : '—';

            return `
                <div class="employee-card status-${emp.status}">
                    ${particlesHTML}
                    <div class="card-header">
                        <div style="display:flex;align-items:center;gap:12px">
                            <div class="employee-avatar">
                                ${emp.avatar_emoji}
                                ${typingHTML}
                            </div>
                            <div>
                                <div class="employee-name">${emp.name}</div>
                                <div class="employee-role">${emp.role}</div>
                                <div class="employee-dept">${emp.department}</div>
                            </div>
                        </div>
                        <div class="status-badge ${emp.status}">
                            <span class="status-badge-dot"></span>
                            ${cfg.label}
                        </div>
                    </div>

                    <div class="current-task">
                        <div class="current-task-label">${cfg.icon} Tarea Actual</div>
                        <div class="current-task-text">${emp.current_task}</div>
                    </div>

                    <div class="employee-metrics">
                        <div class="metric">
                            <div class="metric-value" style="color:${cfg.color}">${emp.tasks_completed_today}</div>
                            <div class="metric-label">Hoy</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${emp.metrics.success_rate}%</div>
                            <div class="metric-label">Éxito</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${emp.metrics.errors_today}</div>
                            <div class="metric-label">Errores</div>
                        </div>
                    </div>

                    <div class="employee-footer">
                        <div class="schedule-info">
                            🕐 ${emp.schedule}
                        </div>
                        <div class="uptime-info">
                            ▲ ${emp.uptime_today}
                        </div>
                    </div>
                </div>`;
        }

        // ─── Render Activity Feed ───
        function renderActivityFeed(employees) {
            const allLogs = [];
            employees.forEach(emp => {
                (emp.recent_logs || []).forEach(log => {
                    allLogs.push({
                        name: emp.name,
                        emoji: emp.avatar_emoji,
                        time: log.time,
                        message: log.message,
                        status: emp.status
                    });
                });
            });

            // Sort by time descending
            allLogs.sort((a, b) => b.time.localeCompare(a.time));

            return allLogs.map((log, i) => `
                ${i > 0 ? '<div class="activity-divider"></div>' : ''}
                <div class="activity-item">
                    <div class="activity-avatar">${log.emoji}</div>
                    <div class="activity-content">
                        <div class="activity-header">
                            <span class="activity-name">${log.name}</span>
                            <span class="activity-time">${log.time}</span>
                        </div>
                        <div class="activity-message">${log.message}</div>
                    </div>
                </div>`).join('');
        }

        // ─── Update Stats ───
        function updateStats(employees) {
            const working = employees.filter(e => e.status === 'working').length;
            const tasksToday = employees.reduce((s, e) => s + e.tasks_completed_today, 0);
            const totalTasks = employees.reduce((s, e) => s + e.tasks_completed_total, 0);
            const avgSuccess = employees.length > 0
                ? (employees.reduce((s, e) => s + e.metrics.success_rate, 0) / employees.length).toFixed(1)
                : 0;

            animateValue('statWorking', working);
            animateValue('statTasks', tasksToday);
            document.getElementById('statSuccess').textContent = avgSuccess + '%';
            animateValue('statTotal', totalTasks);
            document.getElementById('employeeCount').textContent = `${employees.length} empleados`;
        }

        // ─── Animate number ───
        function animateValue(id, target) {
            const el = document.getElementById(id);
            const current = parseInt(el.textContent) || 0;
            if (current === target) { el.textContent = target.toLocaleString(); return; }

            const duration = 800;
            const start = performance.now();

            function step(now) {
                const progress = Math.min((now - start) / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const value = Math.round(current + (target - current) * ease);
                el.textContent = value.toLocaleString();
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        // ─── Time ago helper ───
        function timeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'hace ' + seconds + 's';
            if (seconds < 3600) return 'hace ' + Math.floor(seconds / 60) + 'm';
            if (seconds < 86400) return 'hace ' + Math.floor(seconds / 3600) + 'h';
            return 'hace ' + Math.floor(seconds / 86400) + 'd';
        }

        // ─── Load Data ───
        async function loadData() {
            try {
                const res = await fetch('status.json?t=' + Date.now());
                const data = await res.json();

                document.getElementById('employeesGrid').innerHTML =
                    data.employees.map(renderEmployeeCard).join('');

                document.getElementById('activityFeed').innerHTML =
                    renderActivityFeed(data.employees);

                updateStats(data.employees);

                const updated = new Date(data.last_updated);
                document.getElementById('lastUpdate').textContent =
                    'Última actualización: ' + updated.toLocaleTimeString('es-MX');

            } catch (err) {
                console.error('Error cargando datos:', err);
            }
        }

        // ─── Init ───
        loadData();
        setInterval(loadData, 30000); // Refresh cada 30s
    </script>
</body>
</html>
